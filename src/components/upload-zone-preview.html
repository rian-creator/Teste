<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview - UploadZone</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: #11172a;
        --border: #2a3558;
        --text: #e8eeff;
        --muted: #9fb0d9;
        --primary: #5b8cff;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top, #1b2440, var(--bg));
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .stack {
        width: min(760px, 100%);
        display: grid;
        gap: 16px;
      }
      .upload-zone {
        display: flex;
        align-items: center;
        gap: 20px;
        border: 2px dashed var(--border);
        border-radius: 18px;
        padding: 20px;
        background: var(--card);
      }
      .upload-zone.loaded {
        border-color: color-mix(in srgb, var(--primary) 60%, var(--border));
        background: color-mix(in srgb, var(--primary) 8%, var(--card));
      }
      .icon-box {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: #1b2542;
        color: var(--muted);
        font-size: 24px;
      }
      .upload-zone.loaded .icon-box {
        background: color-mix(in srgb, var(--primary) 18%, #1b2542);
        color: #bcd1ff;
      }
      .content {
        min-width: 0;
        flex: 1;
      }
      .title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .desc {
        font-size: 14px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .status {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: #1b2542;
        color: var(--muted);
        font-size: 18px;
      }
      .upload-zone.loaded .status {
        background: var(--primary);
        color: #fff;
      }
      .legend {
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <div class="legend">Estado: <strong>não carregado</strong></div>
      <div class="upload-zone" role="button" aria-label="Envie a planilha consolidada">
        <div class="icon-box">📄</div>
        <div class="content">
          <div class="title">Envie a planilha consolidada</div>
          <div class="desc">Arquivo .xlsx único contendo todas as abas (Ligação Atendida, Resultado, Horário, Descarte, Funil, Médias)</div>
        </div>
        <div class="status">⬆️</div>
      </div>

      <div class="legend">Estado: <strong>carregado</strong></div>
      <div class="upload-zone loaded" role="button" aria-label="Planilha consolidada carregada">
        <div class="icon-box">📄</div>
        <div class="content">
          <div class="title">Planilha consolidada carregada</div>
          <div class="desc">consolidado-abril-2026.xlsx</div>
        </div>
        <div class="status">✓</div>
      </div>
    </div>
  </body>
</html>
